name: security-check

services:
  zap:
    profiles: [dynamic]
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    user: zap
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      security.run: ${SECURITY_RUN_ID:-unused}
    networks: [security-runtime]
    tmpfs:
      - /tmp:rw,nosuid,size=1536m,mode=1777
    environment:
      HOME: /tmp
      SECURITY_SCAN_SECONDS: ${SECURITY_SCAN_SECONDS:-1800}
    volumes:
      - type: bind
        source: ./scripts/internal/security
        target: /checks
        read_only: true
    entrypoint: [python3, /checks/zap_scan.py]
  security-postgres:
    profiles: [dynamic]
    image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    labels:
      security.run: ${SECURITY_RUN_ID:-unused}
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security
      POSTGRES_PASSWORD: ${SECURITY_DB_PASSWORD:-unused}
    volumes:
      - security-db:/var/lib/postgresql/data
    networks: [security-runtime]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U security -d security"]
      interval: 2s
      timeout: 3s
      retries: 30
  security-redis:
    profiles: [dynamic]
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    labels:
      security.run: ${SECURITY_RUN_ID:-unused}
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [security-runtime]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  semgrep:
    image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    user: "65532:65532"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /input
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    environment:
      HOME: /tmp
      SEMGREP_SETTINGS_FILE: /tmp/settings.yml
      SEMGREP_LOG_FILE: /tmp/semgrep.log
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    volumes:
      - type: bind
        source: ${SEMGREP_INPUT:-./scripts/internal/security}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SEMGREP_RULES:-./scripts/internal/security/semgrep/local}
        target: /rules
        read_only: true
        bind:
          create_host_path: false
    entrypoint: [semgrep]
  trivy:
    image: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      HOME: /tmp
      DOCKER_CONFIG: /tmp/docker
      TRIVY_CACHE_DIR: /cache
      TMPDIR: /cache
    volumes:
      - trivy-cache:/cache
      - type: bind
        source: ${SECURITY_INPUT:-./scripts/internal/security}
        target: /input
        read_only: true
        bind:
          create_host_path: false
  cosign:
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      HOME: /tmp
      DOCKER_CONFIG: /tmp/docker
  npm-audit:
    image: node:24.22.3-alpine3.24@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_USERCONFIG: /dev/null
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - type: bind
        source: ./frontend/package.json
        target: /input/package.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./frontend/package-lock.json
        target: /input/package-lock.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/internal/security/npm-audit.mjs
        target: /checks/npm-audit.mjs
        read_only: true
        bind:
          create_host_path: false
    entrypoint: [node, /checks/npm-audit.mjs]

volumes:
  trivy-cache:
  security-db:
    name: security-db-${SECURITY_RUN_ID:-unused}
    labels:
      security.run: ${SECURITY_RUN_ID:-unused}

networks:
  security-runtime:
    name: security-runtime-${SECURITY_RUN_ID:-unused}
    labels:
      security.run: ${SECURITY_RUN_ID:-unused}
